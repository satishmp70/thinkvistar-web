name: build-and-deploy

# Every push is built and fully checked. Pushes to main (or a manual run) also publish
# the finished site to the `deploy` branch and rsyncs it to the server over SSH (job: deploy).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install
        working-directory: src
        run: npm ci

      - name: Dependency advisories
        run: |
          (cd src && npm audit --audit-level=high)
          composer audit --locked

      - name: Build (CI keeps committed modification dates)
        working-directory: src
        run: npm run build -- --keep-lastmod

      - name: Static verification (SEO, links, schema, output hygiene)
        working-directory: src
        run: npm run verify

      - name: PHP lint
        run: |
          php -l static/api/contact.php
          php -l static/api/config.php

      - name: Browser checks (routes, forms, accessibility, resilience)
        working-directory: src
        run: |
          npm run check -- --screenshots ../check-screenshots
          npm run test:browser

      - name: Contact endpoint and IndexNow tests
        working-directory: src
        run: |
          npm run test:contact
          npm run test:indexnow

      - name: Modification-date behaviour
        working-directory: src
        run: npm run test:lastmod

      - name: Lighthouse gate (median of 3 runs, pinned version)
        working-directory: src
        run: npm run lighthouse -- --json ../lighthouse-results.json

      - name: Keep diagnostics when a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: |
            check-screenshots
            lighthouse-results.json
          if-no-files-found: ignore

      - name: Add PHPMailer (production dependencies only)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts && mv vendor dist/vendor

      - name: Publish dist/ to the deploy branch
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        # Hostinger's Git deployment runs `git pull` on this branch, so it must keep a continuous
        # history (no force-push): check out the existing branch, replace its files with dist/, commit.
        run: |
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO" deploy >/dev/null; then
            git clone -q --branch deploy --single-branch "$REPO" deploy-branch
          else
            git init -q -b deploy deploy-branch
          fi
          cd deploy-branch
          git rm -rq --ignore-unmatch .
          cp -a ../dist/. .
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A -f
          if git diff --cached --quiet; then echo "deploy branch already up to date"; exit 0; fi
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push "$REPO" HEAD:deploy

      - name: Hand the built site to the deploy job
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true   # keeps .htaccess
          retention-days: 7

  # Copies the checked site straight to the server over SSH. Runs only after every check passed.
  # Settings live in GitHub → Settings → Environments → production (see DEPLOYMENT.md).
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://thinkvistar.com' }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Check deploy settings
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'production' environment:$missing"
            exit 1
          fi
          # Only ever deploy into thinkvistar.com's own web root, so other sites on the same
          # hosting account can never be touched.
          # Exactly /home/<user>/domains/thinkvistar.com/public_html (one path segment for <user>).
          if ! [[ "$DEPLOY_PATH" =~ ^/home/[A-Za-z0-9._-]+/domains/thinkvistar\.com/public_html/?$ ]] || [[ "$DEPLOY_PATH" == *..* ]]; then
            echo "::error::DEPLOY_PATH '$DEPLOY_PATH' is not /home/<user>/domains/thinkvistar.com/public_html; refusing to deploy"
            exit 1
          fi
          case "${{ vars.SITE_URL || 'https://thinkvistar.com' }}" in
            https://thinkvistar.com|https://thinkvistar.com/|https://www.thinkvistar.com|https://www.thinkvistar.com/) ;;
            *) echo "::error::SITE_URL must be https://thinkvistar.com"; exit 1 ;;
          esac
          test -f site/index.html && test -f site/.htaccess && test -f site/vendor/autoload.php

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Confirm the target folder on the server is thinkvistar.com's
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Resolve symlinks on the server: refuses if public_html is (or sits under) a link
          # pointing at another domain's folder, or does not exist.
          real=$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "readlink -e '${DEPLOY_PATH%/}'") || { echo "::error::DEPLOY_PATH does not exist on the server"; exit 1; }
          echo "Server path resolves to: $real"
          if ! [[ "$real" =~ ^/home/[A-Za-z0-9._-]+/domains/thinkvistar\.com/public_html$ ]]; then
            echo "::error::DEPLOY_PATH resolves to '$real', not thinkvistar.com's public_html; refusing to deploy"
            exit 1
          fi
          echo "REAL_DEPLOY_PATH=$real" >> "$GITHUB_ENV"

      - name: Upload to server (rsync)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # --delete removes files that no longer exist in the build, but the excluded paths are
          # never touched: the secrets file, SSL validation files and any old git checkout.
          rsync -rlptz --checksum --delete-after --delay-updates \
            --chmod=D755,F644 \
            --exclude='/.env' --exclude='/api/.env' \
            --exclude='/.well-known/' --exclude='/.git/' \
            --exclude='/.user.ini' --exclude='/php.ini' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            site/ "$SSH_USER@$SSH_HOST:$REAL_DEPLOY_PATH/"

      - name: Smoke test the live site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://thinkvistar.com' }}
        run: |
          sleep 5
          home=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")
          api=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/contact.php")
          echo "Home page: $home   Contact endpoint (GET): $api"
          [ "$home" = "200" ] || { echo "::error::Home page returned $home"; exit 1; }
          [ "$api" = "405" ] || { echo "::error::/api/contact.php returned $api (expected 405 Method not allowed)"; exit 1; }

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
