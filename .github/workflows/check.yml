name: build-and-deploy

# Every push is built and fully checked. Pushes to main (or a manual run) also publish
# the finished site to the `deploy` branch, which Hostinger pulls into public_html.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install
        working-directory: src
        run: npm ci

      - name: Dependency advisories
        run: |
          (cd src && npm audit --audit-level=high)
          composer audit --locked

      - name: Build (CI keeps committed modification dates)
        working-directory: src
        run: npm run build -- --keep-lastmod

      - name: Static verification (SEO, links, schema, output hygiene)
        working-directory: src
        run: npm run verify

      - name: PHP lint
        run: |
          php -l static/api/contact.php
          php -l static/api/config.php

      - name: Browser checks (routes, forms, accessibility, resilience)
        working-directory: src
        run: |
          npm run check -- --screenshots ../check-screenshots
          npm run test:browser

      - name: Contact endpoint and IndexNow tests
        working-directory: src
        run: |
          npm run test:contact
          npm run test:indexnow

      - name: Modification-date behaviour
        working-directory: src
        run: npm run test:lastmod

      - name: Lighthouse gate (median of 3 runs, pinned version)
        working-directory: src
        run: npm run lighthouse -- --json ../lighthouse-results.json

      - name: Keep diagnostics when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            check-screenshots
            lighthouse-results.json
          if-no-files-found: ignore

      - name: Add PHPMailer (production dependencies only)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts && mv vendor dist/vendor

      - name: Publish dist/ to the deploy branch
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
